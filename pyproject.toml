[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attendance-core"
version = "0.1.0"
description = "Reusable attendance domain logic for RAE and reporting pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["attendance_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
